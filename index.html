<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f568a3" />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23f568a3'/%3E%3Cpath d='M20 46 32 18l12 28h-7.2l-4.8-12-4.8 12z' fill='%23fff'/%3E%3C/svg%3E"
    />
    <meta
      name="description"
      content="AIQUOS — Learn. Create. Achieve. Three independent screens. Endless possibilities."
    />
    <meta property="og:title" content="AIQUOS — Learn. Create. Achieve." />
    <meta
      property="og:description"
      content="An interactive creative playground. Make every screen your own."
    />
    <title>AIQUOS — Learn. Create. Achieve.</title>
  </head>
  <body>
    <div id="root">
      <!-- First-paint splash: replaced the moment React mounts. Pure CSS so it
           costs nothing and never flashes after the app is live. -->
      <style>
        #root:empty::after {
          content: "";
          position: fixed;
          inset: 0;
          display: block;
          background: #f568a3;
        }
        #root:empty::before {
          content: "";
          position: fixed;
          top: 50%;
          left: 50%;
          width: 46px;
          height: 46px;
          margin: -23px 0 0 -23px;
          border: 3px solid rgb(255 255 255 / 0.35);
          border-top-color: #fff;
          border-radius: 25%;
          animation: aiquos-boot 900ms linear infinite;
        }
        @keyframes aiquos-boot {
          to { transform: rotate(360deg); }
        }
        @media (prefers-reduced-motion: reduce) {
          #root:empty::before { animation: none; }
        }
      </style>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
