<!DOCTYPE html>
<html lang="zh-CN">
<head>
<script src="../embed-runtime.js"></script>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<title>企鹅叠叠乐 · 实时 3D</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%230d1b2a'/%3E%3Ccircle cx='16' cy='11' r='6' fill='%234aa3e2'/%3E%3Cellipse cx='16' cy='23' rx='8' ry='7' fill='%232b6ea8'/%3E%3Ccircle cx='13.5' cy='10' r='1.4' fill='%23fff'/%3E%3Ccircle cx='18.5' cy='10' r='1.4' fill='%23fff'/%3E%3C/svg%3E" />
<style>
  html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; background: #0d1b2a; }
  canvas { display: block; width: 100%; height: 100%; }
  #c { position: fixed; inset: 0; }
  /* The model is the whole point, so the loading state stays a flat ground colour
     rather than a spinner: the parent keeps the previous frame on screen until
     this page announces itself ready. */
  #fail {
    position: fixed;
    inset: 0;
    display: none;
    place-content: center;
    color: #cfe4f5;
    font: 500 14px/1.6 system-ui, -apple-system, "PingFang SC", sans-serif;
    text-align: center;
  }
  #fail.on { display: grid; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="fail">模型载入失败</div>
<script src="./scene.js"></script>
</body>
</html>
